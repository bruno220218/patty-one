# Backup semanal do banco (o Supabase grátis não faz backup automático).
# Precisa dos secrets SUPABASE_DB_URL e BACKUP_PASSPHRASE no GitHub
# (Settings > Secrets and variables > Actions).
# ATENÇÃO: em repositório PÚBLICO os "Artifacts" podem ser baixados por qualquer conta do
# GitHub. Por isso o backup sobe CRIPTOGRAFADO (AES-256) com a BACKUP_PASSPHRASE; sem ela,
# o backup não sobe. Para abrir: gpg --decrypt patty-one-AAAA-MM-DD.backup.gpg > arquivo.backup
name: Supabase backup
on:
  schedule:
    - cron: "41 6 * * 0" # domingo, 03:41 de Brasília
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instala pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Gera backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::Falta o secret SUPABASE_DB_URL"; exit 1; fi
          if [ ${#PASSPHRASE} -lt 20 ]; then
            echo "::error::Falta o secret BACKUP_PASSPHRASE (mínimo 20 caracteres). Sem ele o backup não sobe aberto."
            exit 1
          fi
          stamp=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc --no-owner --no-privileges \
            -n public -n auth -f "patty-one-$stamp.backup"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 -o "patty-one-$stamp.backup.gpg" "patty-one-$stamp.backup" 3<<<"$PASSPHRASE"
          shred -u "patty-one-$stamp.backup"
          ls -lh *.backup.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: "*.backup.gpg"
          if-no-files-found: error
          retention-days: 90
